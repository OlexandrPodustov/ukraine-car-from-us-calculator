<html lang="uk">

    <meta charset="utf-8" />

    <title>Лоти — Авто із США</title>

    <style>
      .page {
        font-family: Roboto, system-ui, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
        color: #1f2937;
      }
      h1 {
        font-size: 22px;
        margin: 8px 0 16px;
      }
      .muted {
        color: #6b7280;
        font-size: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
        margin-top: 16px;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        background: #fff;
        transition: box-shadow 0.15s;
      }
      .card:hover {
        box-shadow: 0 4px 14px rgb(0 0 0 / 12%);
      }
      .card .thumb {
        width: 100%;
        height: 160px;
        object-fit: cover;
        background: #f3f4f6;
        display: block;
      }
      .card .noimg {
        width: 100%;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f4f6;
        color: #9ca3af;
        font-size: 13px;
      }
      .card .body {
        padding: 10px 12px;
      }
      .card .title {
        font-weight: 700;
        font-size: 15px;
      }
      .card .sub {
        color: #6b7280;
        font-size: 12px;
        margin: 2px 0 6px;
      }
      /* VIN — 17 символів моноширинним, щоб читався і збігався по ширині
         з VIN у модалці та на сторінках пошуків/статистики. */
      .vin {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.02em;
        color: #374151;
        margin-bottom: 6px;
        user-select: all;
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 12px;
        color: #374151;
      }
      .pill {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 999px;
        background: #eef2ff;
        color: #3730a3;
        font-size: 11px;
        margin-top: 6px;
      }

      /* Вердикт угоди: різниця «укр. ринок − наш кошт» з останнього пошуку. */
      .pill + .pill {
        margin-left: 6px;
      }

      .pill.good {
        background: #dcfce7;
        color: #14532d;
      }

      .pill.bad {
        background: #fee2e2;
        color: #7f1d1d;
      }
      .empty {
        padding: 40px;
        text-align: center;
        color: #6b7280;
      }

      /* overlay */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgb(0 0 0 / 60%);
        display: none;
        align-items: flex-start;
        justify-content: center;
        z-index: 20000;
        overflow: auto;
        padding: 24px;
      }
      .overlay.open {
        display: flex;
      }
      .modal {
        background: #fff;
        border-radius: 14px;
        max-width: 1000px;
        width: 100%;
        overflow: hidden;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #e5e7eb;
      }
      .modal-head h2 {
        font-size: 18px;
        margin: 0;
      }
      .close {
        border: none;
        background: #f3f4f6;
        border-radius: 8px;
        font-size: 18px;
        padding: 4px 12px;
        cursor: pointer;
      }
      .modal-body {
        padding: 16px;
      }
      .main-img {
        width: 100%;
        max-height: 540px;
        object-fit: contain;
        background: #111827;
        border-radius: 10px;
      }
      .thumbs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 8px 0;
      }
      .thumbs img {
        height: 56px;
        width: 76px;
        object-fit: cover;
        border-radius: 6px;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .thumbs img.sel {
        border-color: #2563eb;
      }
      .media-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .btn {
        text-decoration: none;
        background: #2563eb;
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;

      .btn.alt {

      .main-img {

      /* fullscreen lightbox */
      .lightbox {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 30000;

      .lightbox.open {

      }
      .lightbox img {
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
      }
      .lb-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgb(255 255 255 / 15%);
        color: #fff;
        border: none;
        font-size: 44px;
        line-height: 1;
        width: 66px;
        height: 90px;
        cursor: pointer;
        border-radius: 10px;

      .lb-close {
        position: absolute;

      .toolbar {

      /* app.css робить усі input/select на всю ширину з відступом знизу —

      .toolbar input[type="search"] {

    <div class="page">
      <h1>Збережені лоти з аукціонів</h1>
      <p class="muted">
        Кожне зчитування лоту на калькуляторі зберігає сюди повну інформацію +
        HD-фото та відео. Клікни картку для деталей.
      </p>
      <div class="toolbar">
        <input
          id="q"
          type="search"
          placeholder="Фільтр: марка, модель, VIN, № лоту, штат, пошкодження…"

        />
        <select id="sort">
          <option value="new">Спершу нові</option>

          ><input type="checkbox" id="onlyDeals" /> лише прораховані</label
        >

    <div class="overlay" id="overlay">

    <div class="lightbox" id="lightbox">
      <button class="lb-close" id="lbClose" title="Закрити (Esc)">✕</button>
      <button class="lb-btn lb-prev" id="lbPrev" title="Назад (←)">‹</button>
      <img
        id="lbImg"
        src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
        alt=""
      />
      <button class="lb-btn lb-next" id="lbNext" title="Далі (→)">›</button>
      <div class="lb-counter" id="lbCounter"></div>

    <script>
      // API на node-сервері (:5500). Якщо сторінку відкрито з іншого порту
      // (Live Server :5501) чи з файлу — б'ємо в :5500 напряму (CORS дозволено).
      // Сторінку віддає або сам node-сервер (тоді працює відносний шлях, і
      // байдуже, на якому він порту), або Live Server / file:// — тоді
      // потрібна абсолютна адреса :5500. Пробуємо по черзі й запам'ятовуємо
      // ту, що спрацювала: захардкоджене «не 5500 → localhost:5500» ламалось
      // на будь-якому іншому PORT.
      var API_BASES = (location.protocol === "file:" ? [] : [""]).concat(
        "http://localhost:5500",
      );
      var API_RESOLVED = null;
      function apiFetch(route) {
        var bases = API_RESOLVED === null ? API_BASES : [API_RESOLVED];
        var i = 0;
        function attempt() {
          return fetch(bases[i] + route)
            .then(function (r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
              API_RESOLVED = bases[i];
              return r;
            })
            .catch(function (e) {
              i += 1;
              if (i < bases.length) return attempt();
              throw e;
            });
        }
        return attempt();
      }
      // Поточна галерея відкритого лота: список фото + активний індекс.
      var LB = { images: [], index: 0 };
      function $(id) {
        return document.getElementById(id);
      }
      function fmt(n) {
        if (n === null || n === undefined || n === "" || isNaN(n)) return "—";
        return "$" + Math.round(Number(n)).toLocaleString("en-US");
      }
      // Екрануємо і ' та ` — значення з esc() підставляються в атрибути,
      // а дані приходять зі скрапленої сторінки аукціону.
      function esc(s) {
        return (s == null ? "" : String(s)).replace(/[<>&"'`]/g, function (c) {
          return {
            "<": "&lt;",
            ">": "&gt;",
            "&": "&amp;",
            '"': "&quot;",
            "'": "&#39;",
            "`": "&#96;",
          }[c];
        });
      }
      // Пропускає лише http(s): у БД (лот 29) колись потрапив скопійований
      // текст сторінки замість URL, і кнопка вела в нікуди.
      function safeUrl(u) {
        var v = (u == null ? "" : String(u)).trim();
        return /^https?:\/\/[^\s]+$/i.test(v) ? v : "";
      }

      // Якщо url загубився — збираємо сторінку лоту з аукціону та номера.
      function canonicalLotUrl(auction, lotNumber) {
        var n = (lotNumber == null ? "" : String(lotNumber)).trim();
        if (!/^[0-9]{4,12}$/.test(n)) return "";
        if (auction === "iaai")
          return "https://www.iaai.com/VehicleDetail/" + n + "~US";
        if (auction === "copart") return "https://www.copart.com/lot/" + n;
        return "";
      }

      function dt(iso) {
        try {
          return new Date(iso).toLocaleString("uk-UA", {
            dateStyle: "short",
            timeStyle: "short",
          });
        } catch (e) {
          return iso;
        }
      }

      // Прев'ю картки: маленький thumbnail (188×141) розтягувався на всю
      // картку й виглядав розмито. У IAAI-резайзера можна попросити будь-який
      // розмір — перезамовляємо чітке зображення під розмір картки (×2 для
      // retina). Для не-резайзерних URL (Copart) повертаємо як є.
      function cardImg(hd, thumb) {
        var url = hd || thumb || "";
        if (/[?&]width=\d+/.test(url) && /[?&]height=\d+/.test(url)) {
          return url
            .replace(/([?&]width=)\d+/, "$1520")
            .replace(/([?&]height=)\d+/, "$1360");
        }
        return url;
      }

      // Останній пошук ринкової ціни по цьому лоту (сервер підмішує його в
      // /api/lots). Різниця «укр. ринок − наш кошт» — це і є те, заради чого
      // лот узагалі дивляться, тож вона має бути видна на картці.
      // Вигідність перераховуємо тут із market_price − total_cost, а не беремо
      // збережений `diff`: до 2026-08-23 у ньому стояв ринок − (кошт + ремонт),
      // де ремонт — кошторис американського аукціону (ціни США, оригінальні
      // деталі). Старі рядки лишаються в БД із тією формулою, тож перерахунок
      // вирівнює і їх, і категорію угоди під ним.
      function dealDiff(r) {
        if (
          !r.total_cost ||
          r.market_price === null ||
          r.market_price === undefined
        )
          return null;
        return r.market_price - r.total_cost;
      }

      function dealCategory(r, diff) {
        if (!r.total_cost) return "";
        if (Math.abs(diff / r.total_cost) <= 0.05) return "fair";
        return diff > 0 ? "underpriced" : "overpriced";
      }

      function dealPill(r) {
        var diff = dealDiff(r);
        if (diff === null) return "";
        var cat = dealCategory(r, diff);
        var cls =
          cat === "underpriced" ? "good" : cat === "overpriced" ? "bad" : "";
        // Те саме ⚠, що раніше стояло тільки на малій вибірці: цифра відома,
        // але спирається на щось непевне. NULL у колонках провенансу означає
        // «рядок старіший за них» — невідомо ≠ погано, такі не мітимо.
        var caveats = [];
        if (r.sample_count && r.sample_count < 5)
          caveats.push("вибірка n=" + r.sample_count + " (<5)");
        if (r.location_match === "none")
          caveats.push(
            "локацію не зматчено — плече до порту й фрахт від дефолтної філії",
          );
        else if (r.location_match === "weak")
          caveats.push("локація підібрана лише за штатом");
        if (r.rates_source === "stale") caveats.push("курс із кешу, не з НБУ");
        else if (r.rates_source === "default")
          caveats.push("курс за замовчуванням, не з НБУ");
        return (
          '<span class="pill ' +
          cls +
          '" title="фінальна ціна ' +
          esc(fmt(r.total_cost)) +
          " · ринок " +
          esc(fmt(r.market_price)) +
          (r.search_repair_cost
            ? " · ремонт (США, не враховано) " + esc(fmt(r.search_repair_cost))
            : "") +
          (r.sample_count ? " · n=" + r.sample_count : "") +
          (r.usd_uah ? " · курс $/₴ " + esc(String(r.usd_uah)) : "") +
          (caveats.length ? " · ⚠ " + esc(caveats.join("; ")) : "") +
          '">' +
          (diff > 0 ? "+" : "−") +
          esc(fmt(Math.abs(diff))) +
          (caveats.length ? " ⚠" : "") +
          "</span>"
        );
      }

      function airbagLabel(v) {
        if (v === "Intact") return "цілі";
        if (v === "Deployed") return "спрацювали";
        return v;
      }

      // Місто/штат авто, а не філії: у offsite-лотах вони різні, і плече до
      // порту рахується саме від авто.
      function lotLocation(r) {
        var place = [r.vehicle_city, r.vehicle_state]
          .filter(Boolean)
          .join(", ");
        if (!place) return r.selling_branch || r.branch_state || "";
        return r.offsite ? place + " (offsite)" : place;
      }

      // ── Список карток ────────────────────────────────────────────
      var ALL_LOTS = [];

      // Текст, по якому шукає фільтр. Один рядок на лот, зібраний один раз —
      // фільтрувати доводиться на кожне натискання клавіші.
      function haystack(r) {
        return [
          r.year,
          r.make,
          r.model,
          r.series,
          r.vin,
          r.lot_number,
          r.body_style,
          r.fuel,
          r.color,
          r.primary_damage,
          r.title_code,
          r.vehicle_city,
          r.vehicle_state,
          r.selling_branch,
          r.branch_state,
          // Щоб «гібрид» і «cat» працювали як фільтри в пошуковому рядку.
          r.hybrid ? "гібрид hybrid" : "",
          r.cat_indicator ? "cat повінь" : "",
          r.title_sale_doc,
          r.manufactured_in,
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
      }

      // Ціна, за якою сортуємо «дешевші»: те саме, що показано на пілюлі.
      function cardPrice(r) {
        return r.acv || r.buy_now_price || r.min_bid || 0;
      }

      // Лоти без значення завжди йдуть у кінець — але не через ±Infinity:
      // два таких лоти давали Infinity − Infinity = NaN, а компаратор із NaN
      // лишає порядок невизначеним. І `0 || -Infinity` відправляв угоду з
      // нульовою різницею вниз, ніби її не рахували.
      function by(get, desc) {
        return function (a, b) {
          var x = get(a);
          var y = get(b);
          var noX = x === null || x === undefined || isNaN(x);
          var noY = y === null || y === undefined || isNaN(y);
          if (noX && noY) return 0;
          if (noX) return 1;
          if (noY) return -1;
          return desc ? y - x : x - y;
        };
      }

      var SORTS = {
        new: by(function (r) {
          return r.id;
        }, true),
        deal: by(function (r) {
          return dealDiff(r);
        }, true),
        price: by(function (r) {
          return cardPrice(r) || null;
        }, false),
        odo: by(function (r) {
          return r.odometer || null;
        }, false),
        year: by(function (r) {
          return r.year;
        }, true),
      };

      function renderGrid() {
        var g = $("grid");
        var q = ($("q").value || "").trim().toLowerCase();
        var onlyDeals = $("onlyDeals").checked;

        var rows = ALL_LOTS.filter(function (r) {
          if (onlyDeals && dealDiff(r) === null) return false;
          if (!q) return true;
          return q.split(/\s+/).every(function (w) {
            return r.__hay.indexOf(w) !== -1;
          });
        }).sort(SORTS[$("sort").value] || SORTS.new);

        $("count").textContent =
          rows.length === ALL_LOTS.length
            ? ALL_LOTS.length + " лотів"
            : rows.length + " з " + ALL_LOTS.length;

        if (!rows.length) {
          g.className = "";
          g.innerHTML = '<div class="empty">Нічого не знайшлось.</div>';
          return;
        }

        g.className = "grid";
        g.innerHTML = rows
          .map(function (r) {
            var title =
              [r.year, r.make, r.model].filter(Boolean).join(" ") || "Лот";
            var thumbSrc = cardImg(r.primary_hd, r.primary_thumb);
            var thumb = thumbSrc
              ? '<img class="thumb" loading="lazy" src="' +
                esc(thumbSrc) +
                '" alt="">'
              : '<div class="noimg">без фото</div>';
            var facts = [
              r.odometer ? r.odometer.toLocaleString("en-US") + " mi" : "",
              r.fuel || "",
              r.primary_damage ? "пошк.: " + r.primary_damage : "",
              // Стан лота вирішує, скільки закладати на ремонт, тож на
              // картці він потрібніший за назву філії.
              r.run_and_drive === "True" ? "🔑 їде" : "",
              r.has_keys === "True" ? "ключі є" : "",
              r.airbags ? "подушки: " + airbagLabel(r.airbags) : "",
              r.title_code ? "тайтл " + r.title_code : "",
              r.hybrid ? "гібрид" : "",
              r.cat_indicator ? "⚠ CAT" : "",
              r.who_can_buy ? "⚠ ліцензія: " + r.who_can_buy : "",
              lotLocation(r),
            ]
              .filter(Boolean)
              .map(function (x) {
                return "<span>" + esc(x) + "</span>";
              })
              .join("");
            var price = r.acv
              ? "ACV " + fmt(r.acv)
              : r.buy_now_price
                ? "BuyNow " + fmt(r.buy_now_price)
                : r.min_bid
                  ? "мін.ставка " + fmt(r.min_bid)
                  : "ціна —";
            var deal = dealPill(r);
            return (
              '<div class="card" data-id="' +
              r.id +
              '">' +
              thumb +
              '<div class="body"><div class="title">' +
              esc(title) +
              '</div><div class="sub">' +
              esc(r.auction ? r.auction.toUpperCase() : "") +
              " · лот " +
              esc(r.lot_number || "—") +
              " · " +
              (r.image_count || 0) +
              ' фото</div><div class="vin">VIN ' +
              // vin — маска аукціону (IAAI ховає останні 6 символів навіть
              // від залогіненого акаунта), vin_full — зчитаний з фото
              // заводської таблички. Показуємо повний, коли він є.
              esc(r.vin_full || r.vin || "—") +
              '</div><div class="facts">' +
              facts +
              '</div><span class="pill">' +
              esc(price) +
              "</span>" +
              deal +
              "</div></div>"
            );
          })
          .join("");
        Array.prototype.forEach.call(g.querySelectorAll(".card"), function (c) {
          c.addEventListener("click", function () {
            openLot(c.getAttribute("data-id"));
          });
        });
      }

      apiFetch("/api/lots")
        .then(function (r) {
          return r.json();
        })
        .then(function (rows) {
          if (!rows || !rows.length) {
            $("grid").innerHTML =
              '<div class="empty">Немає збережених лотів. Зчитай лот на ' +
              '<a href="/index.html">калькуляторі</a> (Copart/IAAI).</div>';
            return;
          }
          ALL_LOTS = rows.map(function (r) {
            r.__hay = haystack(r);
            return r;
          });
          renderGrid();
          $("q").addEventListener("input", renderGrid);
          $("sort").addEventListener("change", renderGrid);
          $("onlyDeals").addEventListener("change", renderGrid);
        })
        .catch(function (e) {
          $("grid").innerHTML =
            '<div class="empty">Помилка: ' +
            e.message +
            " (сервер запущено?)</div>";
        });

      // ── Деталі лота ──────────────────────────────────────────────
      function openLot(id) {
        apiFetch("/api/lots/" + id)
          .then(function (r) {
            return r.json();
          })
          .then(renderModal)
          .catch(function (e) {
            alert("Помилка: " + e.message);
          });
      }

      // VIN окремо від row(): моноширинний і виділяється одним кліком —
      // його зазвичай копіюють у Carfax/страховику. `full` — зчитаний з фото
      // заводської таблички; якщо його нема, лишається маска аукціону, і тоді
      // це видно з підпису, а не з мовчазних зірочок.
      function vinRow(masked, full) {
        var v = full || masked;
        if (!v) return "";
        return (
          '<tr><td>VIN</td><td><span class="vin" style="font-size:13px">' +
          esc(v) +
          "</span>" +
          (full ? "" : ' <span class="muted">(маска аукціону)</span>') +
          "</td></tr>"
        );
      }

      function row(label, val) {
        if (val === null || val === undefined || val === "") return "";
        return "<tr><td>" + label + "</td><td>" + esc(val) + "</td></tr>";
      }

      function renderModal(d) {
        var images = d.images || [];
        LB.images = images;
        LB.index = 0;
        var title =
          [d.year, d.make, d.model].filter(Boolean).join(" ") || "Лот";
        var main = images.length
          ? '<img class="main-img" id="mainImg" title="Відкрити на весь екран" src="' +
            esc(images[0].hd) +
            '" alt="">'
          : '<div class="noimg" style="height:300px">без фото</div>';
        var thumbs = images
          .map(function (im, i) {
            return (
              '<img data-idx="' +
              i +
              '" class="' +
              (i === 0 ? "sel" : "") +
              '" src="' +
              esc(im.thumb) +
              '" alt="">'
            );
          })
          .join("");

        var actions = "";
        var url360 = safeUrl(d.image360_url);
        if (url360)
          actions +=
            '<a class="btn alt" target="_blank" rel="noopener" href="' +
            esc(url360) +
            '">🔄 360° огляд</a>';
        var lotUrl = safeUrl(d.url) || canonicalLotUrl(d.auction, d.lot_number);
        if (lotUrl)
          actions +=
            '<a class="btn alt" target="_blank" rel="noopener" href="' +
            esc(lotUrl) +
            '">↗ Сторінка лоту</a>';
        // Перерахунок іде з raw_json у БД, без звернення до аукціону —
        // сторінка лоту може бути вже знята з торгів.
        actions +=
          '<a class="btn alt" href="/index.html?lot=' +
          encodeURIComponent(d.id) +
          '">🧮 Порахувати в калькуляторі</a>';

        var video = (d.videos || [])
          .map(function (v) {
            return (
              '<video controls preload="none" src="' + esc(v.url) + '"></video>'
            );
          })
          .join("");

        var info =
          '<table class="info">' +
          row("Збережено", dt(d.ts)) +
          row("Аукціон", (d.auction || "").toUpperCase()) +
          row("Лот №", d.lot_number) +
          vinRow(d.vin, d.vin_full) +
          row(
            "Пробіг",
            d.odometer
              ? d.odometer.toLocaleString("en-US") +
                  " mi" +
                  (d.odometer_brand ? " (" + d.odometer_brand + ")" : "")
              : "",
          ) +
          row("Кузов", d.body_style) +
          row("Двигун", d.engine) +
          row("Паливо", d.fuel) +
          row("Привід", d.drive) +
          row("КПП", d.transmission) +
          row("Колір", d.color) +
          row("Салон", d.interior_color) +
          row("Пошкодження", d.primary_damage) +
          row("Втор. пошкодження", d.secondary_damage) +
          row("Тип збитку", d.loss_type) +
          row(
            "Заводиться/їде",
            d.run_and_drive === "True"
              ? "так"
              : d.run_and_drive === "False"
                ? "ні"
                : "",
          ) +
          row(
            "Заводиться",
            /start/i.test(d.starts || "") ? "так" : d.starts || "",
          ) +
          row(
            "Ключі",
            d.has_keys === "True" ? "є" : d.has_keys === "False" ? "нема" : "",
          ) +
          row(
            "Брелок",
            d.key_fob === "True" ? "є" : d.key_fob === "False" ? "нема" : "",
          ) +
          row(
            "Каталізатор",
            d.catalytic_converter === "Present"
              ? "на місці"
              : d.catalytic_converter || "",
          ) +
          // Стихійне лихо (повінь/град) — для імпорту це найчастіше стоп,
          // тож рядок з'являється тільки коли прапорець справді стоїть.
          row("CAT-лот", d.cat_indicator ? "⚠ так (стихійне лихо)" : "") +
          row("Подушки", d.airbags ? airbagLabel(d.airbags) : "") +
          row("Оцінка стану (grade)", d.vehicle_grade) +
          row("Тайтл", d.title_brand) +
          row(
            "Документ",
            [d.title_type, d.title_code].filter(Boolean).join(" · "),
          ) +
          row("Документ на авто", d.title_sale_doc) +
          row("Примітка до тайтла", d.title_notes) +
          row("Колеса", d.wheels) +
          row("Вироблено в", d.manufactured_in) +
          row("Комплектація", d.options) +
          row("Подушки (перелік)", d.restraint_system) +
          // Порожній список = обмежень немає, тож рядок з'являється лише
          // тоді, коли лот справді доступний не всім.
          row("Купувати може", d.who_can_buy) +
          row("ACV", d.acv ? fmt(d.acv) : "") +
          row("Оцінка ремонту", d.repair_cost ? fmt(d.repair_cost) : "") +
          row("Buy Now", d.buy_now_price ? fmt(d.buy_now_price) : "") +
          row("Мін. ставка", d.min_bid ? fmt(d.min_bid) : "") +
          row("Філія", d.selling_branch) +
          row(
            "Де стоїть авто",
            [d.vehicle_city, d.vehicle_state, d.vehicle_zip]
              .filter(Boolean)
              .join(", ") + (d.offsite ? " — offsite" : ""),
          ) +
          row("Дата торгів", d.sale_date) +
          row("Лейн", d.sale_lane) +
          "</table>";

        $("modal").innerHTML =
          '<div class="modal-head"><h2>' +
          esc(title) +
          '</h2><button class="close" id="closeBtn">✕</button></div>' +
          '<div class="modal-body">' +
          main +
          '<div class="thumbs" id="thumbs">' +
          thumbs +
          "</div>" +
          (actions ? '<div class="media-actions">' + actions + "</div>" : "") +
          video +
          info +
          "</div>";

        $("overlay").classList.add("open");
        $("closeBtn").addEventListener("click", closeModal);
        var tdiv = $("thumbs");
        if (tdiv) {
          tdiv.addEventListener("click", function (e) {
            if (e.target.tagName === "IMG") {
              setMain(parseInt(e.target.getAttribute("data-idx"), 10));
            }
          });
        }
        var mi = $("mainImg");
        if (mi)
          mi.addEventListener("click", function () {
            openLightbox(LB.index);
          });
      }

      // Встановити активне фото в модалці (за індексом).
      function setMain(idx) {
        if (!LB.images[idx]) return;
        LB.index = idx;
        var mi = $("mainImg");
        if (mi) mi.src = LB.images[idx].hd;
        var tdiv = $("thumbs");
        if (tdiv)
          Array.prototype.forEach.call(tdiv.children, function (c, i) {
            c.classList.toggle("sel", i === idx);
          });
      }

      function closeModal() {
        $("overlay").classList.remove("open");
        $("modal").innerHTML = "";
      }
      $("overlay").addEventListener("click", function (e) {
        if (e.target === $("overlay")) closeModal();
      });

      // ── Повноекранний перегляд фото (lightbox) ───────────────────
      function openLightbox(idx) {
        if (!LB.images.length) return;
        LB.index = idx || 0;
        $("lightbox").classList.add("open");
        lbShow();
        var el = $("lightbox");
        if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
      }
      function lbShow() {
        var im = LB.images[LB.index];
        if (!im) return;
        $("lbImg").src = im.hd;
        $("lbCounter").textContent = LB.index + 1 + " / " + LB.images.length;
        // Прелоад сусідніх — щоб гортання (у т.ч. затиснутою стрілкою) було плавним.
        [LB.index - 1, LB.index + 1].forEach(function (i) {
          var n = (i + LB.images.length) % LB.images.length;
          if (LB.images[n]) new Image().src = LB.images[n].hd;
        });
      }
      function lbNav(step) {
        if (!LB.images.length) return;
        LB.index = (LB.index + step + LB.images.length) % LB.images.length;
        lbShow();
        setMain(LB.index); // синхронізуємо вибір у модалці
      }
      function closeLightbox() {
        $("lightbox").classList.remove("open");
        if (document.fullscreenElement && document.exitFullscreen)
          document.exitFullscreen().catch(function () {});
      }
      $("lbNext").addEventListener("click", function () {
        lbNav(1);
      });
      $("lbPrev").addEventListener("click", function () {
        lbNav(-1);
      });
      $("lbClose").addEventListener("click", closeLightbox);
      // Esc у нативному fullscreen виходить із нього напряму — синхронізуємо overlay.
      document.addEventListener("fullscreenchange", function () {
        if (
          !document.fullscreenElement &&
          $("lightbox").classList.contains("open")
        )
          $("lightbox").classList.remove("open");
      });

      document.addEventListener("keydown", function (e) {
        if ($("lightbox").classList.contains("open")) {
          if (e.key === "ArrowRight") {
            e.preventDefault();
            lbNav(1);
          } else if (e.key === "ArrowLeft") {
            e.preventDefault();
            lbNav(-1);
          } else if (e.key === "Escape") {
            closeLightbox();
          }
          return;
        }
        if (e.key === "Escape") closeModal();
      });
    </script>
  </body>
</html>
